name: CI
on:
  # Main pushes are verified once by the Pages workflow via workflow_call.
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      STATIC_DIR: out
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      - run: bun run build
      - name: Test in Chromium
        run: bun run test
      - name: Test in Firefox
        run: bun run test
        env:
          PLAYWRIGHT_BROWSER: firefox
